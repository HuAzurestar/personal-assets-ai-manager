<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ app_name }} · 个人资产管理</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="shell">
    <header><div class="brand"><img src="/static/icon.svg" alt=""><span>AssetMind</span></div><p>本地优先的账单与资产管理基线</p></header>
    <section class="cards" id="summary"><article><span>总资产</span><strong>--</strong></article><article><span>累计收入</span><strong>--</strong></article><article><span>累计支出</span><strong>--</strong></article><article><span>账单数</span><strong>--</strong></article></section>
    <section class="grid"><article class="panel"><h2>新增账单</h2><form id="bill-form"><label>交易时间<input name="occurred_at" type="datetime-local" required></label><label>商户<input name="merchant" placeholder="如：滴滴出行" required></label><label>金额（收入为正）<input name="amount" type="number" step="0.01" required></label><label>备注<input name="note" placeholder="可选"></label><button>智能归类并保存</button></form><small id="tag-result"></small></article><article class="panel"><h2>新增资产快照</h2><form id="asset-form"><label>账户名称<input name="account_name" placeholder="招商银行" required></label><label>账户类型<input name="account_type" placeholder="银行卡 / 基金" required></label><label>余额<input name="balance" type="number" step="0.01" required></label><label>记录时间<input name="recorded_at" type="datetime-local" required></label><button>保存快照</button></form></article></section>
    <section class="panel"><h2>最近账单</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>商户</th><th>金额</th><th>分类</th><th>标签</th><th></th></tr></thead><tbody id="bills"></tbody></table></div></section>
  </main><script src="/static/app.js"></script>
</body></html>
